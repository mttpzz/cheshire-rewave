services:
  # --- LITELLM -----------------------------------------------------------------------------------
  # dashboard and logs database
  db:
    image: postgres:16-alpine
    container_name: litellm_db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_password
      POSTGRES_DB: litellm_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - cat-network

  # cache for routing decisions and model metadata (optional but recommended)
  redis:
    image: redis:alpine
    container_name: litellm_redis
    restart: unless-stopped
    networks:
      - cat-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm_proxy
    # ports:
    #   - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY} # proxy password
      - DATABASE_URL=postgresql://litellm:litellm_password@db:5432/litellm_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      # - LITELLM_LOG=DEBUG
      # - LANGFUSE_DEBUG=True
      - FORWARDED_ALLOW_IPS=*
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    networks:
      - cat-network


  # --- CHESHIRE CAT ------------------------------------------------------------------------------
  cheshire-cat-core:
    image: ghcr.io/cheshire-cat-ai/core:latest
    container_name: cheshire_cat_core
    # ports:
    #   - ${CORE_PORT:-1865}:80
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./static:/app/cat/static
      - ./plugins:/app/cat/plugins
      - /app/cat/plugins/vanna/training # exclude folder vanna/training from docker
      - ./data:/app/cat/data
      - ./doc:/app/cat/doc # folder to manage user files
      - ./logs:/app/cat/logs  # logs folder
    env_file:
      - .env  # no file .env in the container — Docker reads the values and writes them directly as environment variables
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cat-network # connect to the same network of litellm to allow communication


  # --- REVERSE PROXY -----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      # - "80:80" # comment on windows because port 80 is often used by other applications
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # for Filebrowser service on ubuntu server
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cheshire-cat-core
      - litellm
    restart: unless-stopped
    networks:
      - cat-network


networks:
  cat-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: